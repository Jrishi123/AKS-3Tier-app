{{- if .Values.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ printf "%s-postgres-bootstrap" .Release.Name }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  provider: azure
  secretObjects:
    - secretName: postgres-bootstrap
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccount.clientId | quote }}
    keyvaultName: {{ .Values.global.keyVault.name | quote }}
    tenantId: {{ .Values.global.keyVault.tenantId | quote }}
    cloudName: AzurePublicCloud
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
{{- end }}
