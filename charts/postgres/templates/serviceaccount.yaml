{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | quote }}
{{- end }}
