{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aks-3tier-poc.fullname" . }}
  labels:
    {{- include "aks-3tier-poc.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: {{ .Values.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          {{- if .Values.api.enabled }}
          - path: {{ include "aks-3tier-poc.apiPath" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-api" .Release.Name }}
                port:
                  number: {{ .Values.api.service.port }}
          {{- end }}
          {{- if .Values.frontend.enabled }}
          - path: {{ include "aks-3tier-poc.frontendPath" . }}
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-frontend" .Release.Name }}
                port:
                  number: {{ .Values.frontend.service.port }}
          {{- end }}
{{- end }}
