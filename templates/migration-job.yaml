{{- if and .Values.migration.enabled .Values.api.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aks-3tier-poc.fullname" . }}-migration
  labels:
    {{- include "aks-3tier-poc.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Starting database migration simulation..."
              echo "Release: {{ .Release.Name }}"
              echo "Target database service: {{ .Release.Name }}-postgres:{{ .Values.postgres.service.port }}"
              sleep 5
              echo "Migration simulation completed successfully."
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
