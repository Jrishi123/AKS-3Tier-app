{{- if .Values.api.enabled }}

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: {{ printf "%s-api-keyvault" .Release.Name }}
  labels:
    {{- include "aks-3tier-poc.labels" . | nindent 4 }}

spec:
  provider: azure

  secretObjects:
    - secretName: api-db-secrets
      type: Opaque
      data:
        - objectName: postgres-username
          key: DB_USER

        - objectName: postgres-password
          key: DB_PASSWORD

  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.global.keyVault.clientId | quote }}
    keyvaultName: {{ .Values.global.keyVault.name | quote }}
    tenantId: {{ .Values.global.keyVault.tenantId | quote }}
    cloudName: AzurePublicCloud

    objects: |
      array:
        - |
          objectName: postgres-username
          objectType: secret

        - |
          objectName: postgres-password
          objectType: secret

{{- end }}
