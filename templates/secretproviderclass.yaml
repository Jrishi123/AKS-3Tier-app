{{- if .Values.api.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ printf "%s-api-keyvault" .Release.Name }}
  labels:
    {{- include "aks-3tier-poc.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: api-db-secrets
      type: Opaque
      data:
        - objectName: DB-HOST
          key: DB_HOST
        - objectName: DB-PORT
          key: DB_PORT
        - objectName: DB-NAME
          key: DB_NAME
        - objectName: DB-USER
          key: DB_USER
        - objectName: DB-PASSWORD
          key: DB_PASSWORD
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.global.keyVault.clientId | quote }}
    keyvaultName: {{ .Values.global.keyVault.name | quote }}
    tenantId: {{ .Values.global.keyVault.tenantId | quote }}
    cloudName: AzurePublicCloud
    objects: |
      array:
        - |
          objectName: DB-HOST
          objectType: secret
        - |
          objectName: DB-PORT
          objectType: secret
        - |
          objectName: DB-NAME
          objectType: secret
        - |
          objectName: DB-USER
          objectType: secret
        - |
          objectName: DB-PASSWORD
          objectType: secret
{{- end }}
