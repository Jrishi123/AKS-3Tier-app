global:
  domain: app.example.com

  keyVault:
    name: CHANGE_ME_KEYVAULT
    tenantId: CHANGE_ME_TENANT_ID
    clientId: CHANGE_ME_API_MANAGED_IDENTITY_CLIENT_ID

frontend:
  enabled: true

  image:
    repository: CHANGE_ME_ACR.azurecr.io/aks-3tier-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

api:
  enabled: true

  image:
    repository: CHANGE_ME_ACR.azurecr.io/aks-3tier-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 3000

  serviceAccount:
    create: true
    name: api
    clientId: CHANGE_ME_API_MANAGED_IDENTITY_CLIENT_ID

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: appdb
    DB_USER: appuser

postgres:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432

  storage:
    size: 8Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

tls:
  enabled: true
  secretName: app-tls
  clusterIssuer: letsencrypt-prod

migration:
  enabled: true
  image:
    repository: node
    tag: "22-alpine"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
